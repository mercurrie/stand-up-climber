# Render Blueprint: one free web service that serves the game page and runs
# the multiplayer WebSocket server on the same URL.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stand-up-climber
    runtime: node
    plan: free
    # Installs all workspaces (Vite is needed for the build), builds the client
    # into client/dist, then the server serves it.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
